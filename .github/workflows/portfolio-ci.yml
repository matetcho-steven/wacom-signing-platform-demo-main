name: portfolio-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-dotnet-sample:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore samples/signing-jobs-api/Signy.Demo.Api.Tests/Signy.Demo.Api.Tests.csproj

      - name: Build
        run: dotnet build samples/signing-jobs-api/Signy.Demo.Api.Tests/Signy.Demo.Api.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test samples/signing-jobs-api/Signy.Demo.Api.Tests/Signy.Demo.Api.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"

  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject obvious secrets
        shell: bash
        run: |
          set -euo pipefail
          pattern='BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}|(password|api[_-]?key|client[_-]?secret)[[:space:]]*=[[:space:]]*[^[:space:]]+'
          if grep -RInE "$pattern" . --exclude-dir=.git --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg'; then
            echo "Potential secret-like content detected. Review before publishing."
            exit 1
          fi
          echo "No obvious secret patterns found."
